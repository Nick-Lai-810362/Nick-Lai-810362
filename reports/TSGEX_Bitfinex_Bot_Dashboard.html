<title>Funding Bot Dashboard</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --page-plane:     #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --success-text:   #006300;
  --series-1:       #2a78d6; /* 2d */
  --series-2:       #eb6834; /* 7d */
  --series-3:       #1baf7a; /* 30d */
  --series-4:       #eda100; /* 120d */
  --card-bg:        #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --success-text:   #0ca30c;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --card-bg:        #232322;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --page-plane:     #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --success-text:   #0ca30c;
  --series-1:       #3987e5;
  --series-2:       #d95926;
  --series-3:       #199e70;
  --series-4:       #c98500;
  --card-bg:        #232322;
}

* { box-sizing: border-box; }
body { background: var(--page-plane); }
.viz-root {
  background: var(--page-plane);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 24px 20px 60px;
  max-width: 1180px;
  margin: 0 auto;
}
h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
.subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }

.panel {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 16px;
}
.panel h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--text-primary); }

.upload-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
input[type=file] { font-size: 13px; color: var(--text-secondary); }
.hint { font-size: 12px; color: var(--text-muted); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.card .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .value.profit { color: var(--success-text); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.filter-field { display: flex; flex-direction: column; gap: 4px; }
.filter-field label { font-size: 11px; color: var(--text-muted); }
.filter-field select, .filter-field input[type=date] {
  font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text-primary);
}
button.primary {
  font-size: 13px; padding: 7px 14px; border-radius: 6px; border: none;
  background: var(--series-1); color: #fff; cursor: pointer; font-weight: 600;
}
button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }

.chart-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
@media (max-width: 760px) { .chart-grid { grid-template-columns: 1fr; } }
.chart-empty { color: var(--text-muted); font-size: 13px; padding: 40px 0; text-align: center; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  text-align: left; font-weight: 600; color: var(--text-muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.02em; padding: 6px 8px; border-bottom: 1px solid var(--gridline);
  position: sticky; top: 0; background: var(--surface-1);
}
tbody td { padding: 6px 8px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover { background: var(--page-plane); }
.status-pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.status-active { background: color-mix(in srgb, var(--series-1) 18%, transparent); color: var(--series-1); }
.status-matured { background: color-mix(in srgb, var(--success-text) 16%, transparent); color: var(--success-text); }
.status-pending { background: color-mix(in srgb, var(--series-4) 20%, transparent); color: var(--series-4); }
.status-cancelled { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-muted); }
.table-scroll { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.row-count { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

.tooltip {
  position: absolute; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
  font-size: 11px; padding: 5px 8px; border-radius: 5px; white-space: nowrap; opacity: 0; transition: opacity .1s;
  z-index: 10; transform: translate(-50%, -100%);
}
</style>

<div class="viz-root">
  <h1>放貸機器人儀表板</h1>
  <p class="subtitle">載入 TSGEX_Bitfinex_Funding_Bot.py 用 --export-csv 匯出的部位紀錄，篩選天期/日期範圍查看細節，並可下載篩選後的 CSV</p>

  <div class="panel">
    <div class="upload-row">
      <input type="file" id="fileInput" accept=".csv" />
      <span class="hint" id="fileHint">尚未載入檔案</span>
    </div>
  </div>

  <div id="dashboardBody" hidden>
    <div class="panel">
      <h2>總覽</h2>
      <div class="cards" id="summaryCards"></div>
      <div class="hint" style="margin-top:10px;">等待成交中的部位金額已從本金/利潤池扣除（下單當下即視為已投入），但尚未開始計息</div>
    </div>

    <div class="panel">
      <h2>篩選</h2>
      <div class="filters">
        <div class="filter-field">
          <label for="fTenor">天期</label>
          <select id="fTenor"><option value="all">全部</option></select>
        </div>
        <div class="filter-field">
          <label for="fStatus">狀態</label>
          <select id="fStatus">
            <option value="all">全部</option>
            <option value="pending">等待成交中</option>
            <option value="active">使用中</option>
            <option value="matured">已到期</option>
            <option value="cancelled">已撤銷重掛</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="fStart">起始日期（依下單時間）</label>
          <input type="date" id="fStart" />
        </div>
        <div class="filter-field">
          <label for="fEnd">結束日期</label>
          <input type="date" id="fEnd" />
        </div>
        <button class="primary" id="downloadBtn">下載篩選結果 CSV</button>
      </div>
    </div>

    <div class="panel">
      <h2>圖表</h2>
      <div class="chart-grid">
        <div>
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">累積已實現利潤（依到期時間）</div>
          <div id="lineChartWrap"></div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">各天期已實現利潤</div>
          <div id="barChartWrap"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>部位明細</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>狀態</th><th>天期</th><th>金額</th><th>本金部分</th><th>利潤部分</th>
              <th>毛年化</th><th>淨年化</th><th>下單時間</th><th>成交時間</th><th>到期時間</th><th>已實現利潤</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="row-count" id="rowCount"></div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  const TENOR_COLOR = {2: 'var(--series-1)', 7: 'var(--series-2)', 30: 'var(--series-3)', 120: 'var(--series-4)'};
  let allRows = [];
  let downloadsNS = null;

  claude.use('downloads').then(ns => {
    downloadsNS = ns;
    if (!ns) document.getElementById('downloadBtn').title = '此檢視無法下載檔案';
  }).catch(() => { downloadsNS = null; });

  function parseCSV(text) {
    const lines = text.replace(/\r/g, '').split('\n').filter(l => l.length > 0);
    if (lines.length < 2) return [];
    const header = lines[0].split(',');
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length < header.length) continue;
      const r = {};
      header.forEach((h, idx) => r[h] = cols[idx]);
      r.tenor_days = parseInt(r.tenor_days, 10);
      r.amount = parseFloat(r.amount);
      r.principal_component = parseFloat(r.principal_component);
      r.profit_component = parseFloat(r.profit_component);
      r.gross_apr = parseFloat(r.gross_apr);
      r.net_apr = parseFloat(r.net_apr);
      r.interest_earned = r.interest_earned === '' ? null : parseFloat(r.interest_earned);
      rows.push(r);
    }
    return rows;
  }

  const STATUS_LABEL = {pending: '等待成交中', active: '使用中', matured: '已到期', cancelled: '已撤銷重掛'};

  function fmtUSD(n) { return '$' + n.toLocaleString('en-US', {maximumFractionDigits: 0}); }
  function fmtPct(n) { return (n*100).toFixed(2) + '%'; }
  function fmtDate(iso) { if (!iso) return ''; return iso.slice(0,10) + ' ' + iso.slice(11,16); }

  function populateTenorFilter() {
    const tenors = Array.from(new Set(allRows.map(r => r.tenor_days))).sort((a,b) => a-b);
    const sel = document.getElementById('fTenor');
    sel.innerHTML = '<option value="all">全部</option>' +
      tenors.map(t => `<option value="${t}">${t} 天</option>`).join('');
  }

  function currentFilters() {
    return {
      tenor: document.getElementById('fTenor').value,
      status: document.getElementById('fStatus').value,
      start: document.getElementById('fStart').value,
      end: document.getElementById('fEnd').value,
    };
  }

  function applyFilters(rows, f) {
    return rows.filter(r => {
      if (f.tenor !== 'all' && String(r.tenor_days) !== f.tenor) return false;
      if (f.status !== 'all' && r.status !== f.status) return false;
      const placedDate = r.placed_ts.slice(0,10);
      if (f.start && placedDate < f.start) return false;
      if (f.end && placedDate > f.end) return false;
      return true;
    });
  }

  function render() {
    const f = currentFilters();
    const rows = applyFilters(allRows, f);
    renderSummary(rows);
    renderTable(rows);
    renderLineChart(rows);
    renderBarChart(rows);
  }

  function renderSummary(rows) {
    const active = rows.filter(r => r.status === 'active');
    const pending = rows.filter(r => r.status === 'pending');
    const matured = rows.filter(r => r.status === 'matured');
    const cancelled = rows.filter(r => r.status === 'cancelled');
    const activeAmount = active.reduce((s,r) => s+r.amount, 0);
    const activePrincipal = active.reduce((s,r) => s+r.principal_component, 0);
    const activeProfit = active.reduce((s,r) => s+r.profit_component, 0);
    const pendingAmount = pending.reduce((s,r) => s+r.amount, 0);
    const realizedProfit = matured.reduce((s,r) => s+(r.interest_earned||0), 0);
    const el = document.getElementById('summaryCards');
    el.innerHTML = [
      ['使用中部位金額', fmtUSD(activeAmount), ''],
      ['使用中本金', fmtUSD(activePrincipal), ''],
      ['使用中利潤（含複投）', fmtUSD(activeProfit), 'profit'],
      ['等待成交中金額', fmtUSD(pendingAmount), ''],
      ['篩選範圍已實現利潤', fmtUSD(realizedProfit), 'profit'],
      ['已撤銷重掛次數', cancelled.length.toLocaleString(), ''],
      ['部位數（篩選後）', rows.length.toLocaleString(), ''],
    ].map(([label, value, cls]) => `
      <div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>
    `).join('');
  }

  function renderTable(rows) {
    const sorted = [...rows].sort((a,b) => b.placed_ts.localeCompare(a.placed_ts));
    const body = document.getElementById('tableBody');
    const shown = sorted.slice(0, 500);
    body.innerHTML = shown.map(r => `
      <tr>
        <td><span class="status-pill status-${r.status}">${STATUS_LABEL[r.status] || r.status}</span></td>
        <td>${r.tenor_days}d</td>
        <td>${fmtUSD(r.amount)}</td>
        <td>${fmtUSD(r.principal_component)}</td>
        <td>${fmtUSD(r.profit_component)}</td>
        <td>${fmtPct(r.gross_apr)}</td>
        <td>${fmtPct(r.net_apr)}</td>
        <td>${fmtDate(r.placed_ts)}</td>
        <td>${fmtDate(r.filled_ts) || '—'}</td>
        <td>${fmtDate(r.maturity_ts) || '—'}</td>
        <td>${r.interest_earned !== null ? fmtUSD(r.interest_earned) : '—'}</td>
      </tr>
    `).join('');
    document.getElementById('rowCount').textContent =
      `顯示 ${shown.length.toLocaleString()} / ${rows.length.toLocaleString()} 筆` + (rows.length > 500 ? '（表格上限500筆，下載CSV可取得全部）' : '');
  }

  function renderLineChart(rows) {
    const wrap = document.getElementById('lineChartWrap');
    const matured = rows.filter(r => r.status === 'matured' && r.matured_ts).sort((a,b) => a.matured_ts.localeCompare(b.matured_ts));
    if (matured.length === 0) {
      wrap.innerHTML = '<div class="chart-empty">篩選範圍內沒有已到期部位</div>';
      return;
    }
    let cum = 0;
    const pts = matured.map(r => { cum += (r.interest_earned||0); return {t: new Date(r.matured_ts).getTime(), v: cum}; });
    const W = 520, H = 220, PAD = 36;
    const t0 = pts[0].t, t1 = pts[pts.length-1].t;
    const vMax = Math.max(...pts.map(p => p.v), 1);
    const x = t => t1 === t0 ? PAD : PAD + (t - t0) / (t1 - t0) * (W - PAD*2);
    const y = v => H - PAD - (v / vMax) * (H - PAD*2);
    const path = pts.map((p,i) => (i===0?'M':'L') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    const areaPath = path + ` L${x(pts[pts.length-1].t).toFixed(1)},${H-PAD} L${x(pts[0].t).toFixed(1)},${H-PAD} Z`;

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">`;
    svg += `<line x1="${PAD}" y1="${H-PAD}" x2="${W-8}" y2="${H-PAD}" stroke="var(--baseline)" stroke-width="1"/>`;
    svg += `<path d="${areaPath}" fill="var(--series-3)" fill-opacity="0.14" stroke="none"/>`;
    svg += `<path d="${path}" fill="none" stroke="var(--series-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(p => {
      svg += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--series-3)" class="pt" data-v="${p.v.toFixed(2)}" data-t="${p.t}"/>`;
    });
    svg += `<text x="${PAD}" y="14" font-size="11" fill="var(--text-muted)">${fmtUSD(vMax)}</text>`;
    svg += `<text x="${PAD}" y="${H-PAD+18}" font-size="10" fill="var(--text-muted)">${new Date(t0).toISOString().slice(0,10)}</text>`;
    svg += `<text x="${W-8}" y="${H-PAD+18}" font-size="10" fill="var(--text-muted)" text-anchor="end">${new Date(t1).toISOString().slice(0,10)}</text>`;
    svg += `</svg>`;
    wrap.innerHTML = svg;

    const tip = document.getElementById('tooltip');
    wrap.querySelectorAll('.pt').forEach(el => {
      el.addEventListener('mouseenter', ev => {
        const rect = el.getBoundingClientRect();
        tip.textContent = fmtUSD(parseFloat(el.dataset.v)) + ' · ' + new Date(parseInt(el.dataset.t)).toISOString().slice(0,10);
        tip.style.left = (rect.left + rect.width/2 + window.scrollX) + 'px';
        tip.style.top = (rect.top + window.scrollY - 6) + 'px';
        tip.style.opacity = '1';
      });
      el.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
    });
  }

  function renderBarChart(rows) {
    const wrap = document.getElementById('barChartWrap');
    const matured = rows.filter(r => r.status === 'matured');
    if (matured.length === 0) {
      wrap.innerHTML = '<div class="chart-empty">篩選範圍內沒有已到期部位</div>';
      return;
    }
    const byTenor = {};
    matured.forEach(r => { byTenor[r.tenor_days] = (byTenor[r.tenor_days]||0) + (r.interest_earned||0); });
    const tenors = Object.keys(byTenor).map(Number).sort((a,b) => a-b);
    const W = 360, H = 220, PAD_L = 46, PAD_B = 30, PAD_T = 10;
    const maxV = Math.max(...tenors.map(t => byTenor[t]), 1);
    const barW = (W - PAD_L - 16) / tenors.length * 0.6;
    const gap = (W - PAD_L - 16) / tenors.length;

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">`;
    svg += `<line x1="${PAD_L}" y1="${H-PAD_B}" x2="${W-8}" y2="${H-PAD_B}" stroke="var(--baseline)" stroke-width="1"/>`;
    tenors.forEach((t, i) => {
      const v = byTenor[t];
      const h = (v / maxV) * (H - PAD_T - PAD_B);
      const bx = PAD_L + i*gap + (gap-barW)/2;
      const by = H - PAD_B - h;
      svg += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${TENOR_COLOR[t] || 'var(--series-1)'}" class="bar" data-v="${v.toFixed(2)}" data-t="${t}"/>`;
      svg += `<text x="${(bx+barW/2).toFixed(1)}" y="${H-PAD_B+16}" font-size="11" fill="var(--text-secondary)" text-anchor="middle">${t}d</text>`;
    });
    svg += `<text x="4" y="${PAD_T+8}" font-size="11" fill="var(--text-muted)">${fmtUSD(maxV)}</text>`;
    svg += `</svg>`;
    wrap.innerHTML = svg;

    const tip = document.getElementById('tooltip');
    wrap.querySelectorAll('.bar').forEach(el => {
      el.addEventListener('mouseenter', ev => {
        const rect = el.getBoundingClientRect();
        tip.textContent = el.dataset.t + '天：' + fmtUSD(parseFloat(el.dataset.v));
        tip.style.left = (rect.left + rect.width/2 + window.scrollX) + 'px';
        tip.style.top = (rect.top + window.scrollY - 6) + 'px';
        tip.style.opacity = '1';
      });
      el.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
    });
  }

  function rowsToCSV(rows) {
    const header = ['id','status','label','tenor_days','amount','principal_component','profit_component',
      'daily_rate','gross_apr','net_apr','placed_ts','filled_ts','maturity_ts','matured_ts','interest_earned'];
    const lines = [header.join(',')];
    rows.forEach(r => {
      lines.push([r.id, r.status, r.label, r.tenor_days, r.amount, r.principal_component, r.profit_component,
        r.daily_rate, r.gross_apr, r.net_apr, r.placed_ts, r.filled_ts||'', r.maturity_ts||'', r.matured_ts||'',
        r.interest_earned ?? ''].join(','));
    });
    return lines.join('\n');
  }

  document.getElementById('fileInput').addEventListener('change', function(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      allRows = parseCSV(e.target.result);
      document.getElementById('fileHint').textContent = `已載入 ${file.name}（${allRows.length.toLocaleString()} 筆部位）`;
      document.getElementById('dashboardBody').hidden = allRows.length === 0;
      try { localStorage.setItem('bfx_dashboard_last_csv', e.target.result); } catch (err) {}
      populateTenorFilter();
      render();
    };
    reader.readAsText(file);
  });

  ['fTenor','fStatus','fStart','fEnd'].forEach(id => {
    document.getElementById(id).addEventListener('change', render);
  });

  document.getElementById('downloadBtn').addEventListener('click', async function() {
    const f = currentFilters();
    const rows = applyFilters(allRows, f);
    if (rows.length === 0) return;
    const csv = rowsToCSV(rows);
    if (!downloadsNS) { alert('此檢視環境不支援直接下載，請改用「另存新檔」或複製表格內容。'); return; }
    try {
      await downloadsNS.save({filename: 'bfx_bot_positions_filtered.csv', data: csv});
    } catch (err) {
      if (err && err.code === 'declined') return;
      alert('下載失敗：' + (err && err.message ? err.message : String(err)));
    }
  });

  // Restore last-loaded CSV from this browser's local storage, if any (per-viewer convenience only)
  try {
    const cached = localStorage.getItem('bfx_dashboard_last_csv');
    if (cached) {
      allRows = parseCSV(cached);
      if (allRows.length > 0) {
        document.getElementById('fileHint').textContent = `已還原上次載入的資料（${allRows.length.toLocaleString()} 筆部位）— 可重新選檔覆蓋`;
        document.getElementById('dashboardBody').hidden = false;
        populateTenorFilter();
        render();
      }
    }
  } catch (err) {}
})();
</script>
